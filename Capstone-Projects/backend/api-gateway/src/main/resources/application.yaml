server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: flight-service
          uri: lb://flight-service
          predicates:
            - Path=/flights/**
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/booking/**,/search/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payment/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

