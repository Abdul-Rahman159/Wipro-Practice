<div class="failed-page">
  <div class="container">
    <div class="failed-content">
      <div class="status-card">
        <!-- Status Icon -->
        <div class="status-icon">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M6 18L18 6M6 6l12 12" />
          </svg>
        </div>

        <!-- Heading -->
        <h1 class="status-title">Payment Failed</h1>

        <!-- Message -->
        <p class="status-message">
          Something went wrong with your payment. Please try again or contact support if the issue continues.
        </p>

        <!-- Buttons -->
        <div class="actions">
          <a routerLink="/" class="btn btn-home">Go to Home</a>
          <button class="btn btn-retry" (click)="retryPayment()">Retry Payment</button>
        </div>
      </div>
    </div>
  </div>
</div>
