<div class="container mt-4">
  <h3>Search Flights</h3>

  <form [formGroup]="form" (ngSubmit)="search()" class="row g-3 align-items-end">
    <div class="col-md-3">
      <label class="form-label">Source</label>
      <input formControlName="source" class="form-control" />
    </div>
    <div class="col-md-3">
      <label class="form-label">Destination</label>
      <input formControlName="destination" class="form-control" />
    </div>
    <div class="col-md-3">
      <label class="form-label">Date</label>
      <input type="date" formControlName="date" class="form-control" />
    </div>
    <div class="col-md-3">
      <button class="btn btn-primary w-100" type="submit" [disabled]="loading">Search</button>
    </div>
  </form>

  <div *ngIf="loading" class="mt-3">Loading...</div>
  <div *ngIf="error" class="alert alert-danger mt-3">{{error}}</div>

  <div class="mt-4" *ngIf="flights && flights.length">
    <h5>Results</h5>
    <table class="table table-striped">
      <thead>
        <tr><th>Flight</th><th>From</th><th>To</th><th>Price</th><th></th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let f of flights">
          <td>{{f.flightNumber}} <small *ngIf="f.aircraft">({{f.aircraft}})</small></td>
          <td>{{f.source}}</td>
          <td>{{f.destination}}</td>
          <td>₹ {{f.price}}</td>
          <td><button class="btn btn-sm btn-success" (click)="book(f)">Book</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && flights?.length===0" class="mt-3">
    No flights found. Try different route or seed sample data from backend.
  </div>
</div>
